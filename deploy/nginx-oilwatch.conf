# OilPriceWatch 反代配置
# 把 oil.example.com 换成你的域名；证书用 certbot 申请：
#   sudo certbot --nginx -d oil.example.com
#
# 关键点：
# 1. 只暴露 80/443，uvicorn 只监听 127.0.0.1:8000
# 2. X-Forwarded-For 必须传，否则 /api/locate 定位到的会是服务器自己
# 3. /webhook/tg 走同一反代；如果配了 OILWATCH_TG_WEBHOOK_SECRET，Telegram 会带
#    X-Telegram-Bot-Api-Secret-Token 头，main.py 会校验

server {
    listen 80;
    server_name oil.example.com;
    # certbot 申请时会自动改写 80 -> 443，这段可保留做兜底
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name oil.example.com;

    ssl_certificate     /etc/letsencrypt/live/oil.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/oil.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 1m;

    # 静态资源（H5/图标/SW）走本地文件，绕开 uvicorn
    location /static/ {
        alias /opt/oilwatch/static/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # PWA 的 manifest/webhook 等该走代理的就走代理
    location = /static/manifest.webmanifest {
        alias /opt/oilwatch/static/manifest.webmanifest;
        default_type application/manifest+json;
    }

    location /webhook/tg {
        proxy_pass http://127.0.0.1:8000/webhook/tg;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
