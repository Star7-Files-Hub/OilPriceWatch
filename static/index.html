<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#0f1115" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<link rel="manifest" href="/static/manifest.webmanifest" />
<link rel="icon" href="/static/icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="/static/icon-192.png" />
<title>全国油价监控 · 调价预测</title>
<style>
  :root {
    --bg: #0f1115; --card: #181b22; --line: #262b35; --fg: #e6e9ef;
    --muted: #9aa3b2; --up: #ff5d5d; --down: #2ecc71; --accent: #4c8dff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 20px; margin: 8px 0 2px; }
  .sub { color: var(--muted); font-size: 12px; margin-bottom: 10px; }
  .locate { font-size: 12px; color: var(--muted); margin-bottom: 12px; min-height: 18px; line-height: 1.7; }
  .locate b { color: var(--accent); }
  .locate a { color: var(--muted); text-decoration: underline; margin-left: 6px; }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 14px; margin-bottom: 14px;
  }
  .forecast-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .big { font-size: 28px; font-weight: 700; }
  .up { color: var(--up); } .down { color: var(--down); }
  .pill {
    font-size: 12px; padding: 2px 8px; border-radius: 999px;
    border: 1px solid var(--line); color: var(--muted);
  }
  .pill.ok { color: var(--down); border-color: var(--down); }
  .pill.warn { color: #ffcc4d; border-color: #ffcc4d; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(72px, 1fr)); gap: 10px; margin-top: 10px; }
  .cell { background: #11141a; border-radius: 8px; padding: 10px; text-align: center; }
  .cell .k { font-size: 11px; color: var(--muted); }
  .cell .v { font-size: 18px; font-weight: 600; margin-top: 4px; }
  .note { color: #ffcc4d; font-size: 12px; margin-top: 8px; }
  .bar { height: 6px; background: #11141a; border-radius: 4px; overflow: hidden; margin-top: 8px; }
  .bar > i { display: block; height: 100%; background: var(--accent); }
  .row { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); margin-top: 6px; }
  select {
    width: 100%; padding: 10px; background: #11141a; color: var(--fg);
    border: 1px solid var(--line); border-radius: 10px; font-size: 15px; margin-bottom: 12px;
  }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { padding: 9px 6px; text-align: right; border-bottom: 1px solid var(--line); }
  th:first-child, td:first-child { text-align: left; }
  th { color: var(--muted); font-weight: 500; font-size: 12px; }
  .region-h { color: var(--accent); font-size: 12px; padding-top: 8px; }
  tr.mine td { background: rgba(76,141,255,.10); }
  tr.mine td:first-child { font-weight: 600; }
  .err { color: var(--up); }
  footer { color: var(--muted); font-size: 11px; text-align: center; padding: 16px 0; }
  a { color: var(--accent); }
</style>
</head>
<body>
<div class="wrap">
  <h1>⛽ 全国油价监控</h1>
  <div class="sub" id="updated">加载中…</div>
  <div class="locate" id="locate"></div>

  <div class="card" id="forecastCard" style="display:none">
    <div class="forecast-head">
      <span class="big" id="fcBig">—</span>
      <span id="fcStatus"></span>
      <span id="fcConsist"></span>
    </div>
    <div class="grid">
      <div class="cell"><div class="k">92# 元/升</div><div class="v" id="fc92">—</div></div>
      <div class="cell"><div class="k">95# 元/升</div><div class="v" id="fc95">—</div></div>
      <div class="cell"><div class="k">98# 元/升</div><div class="v" id="fc98">—</div></div>
      <div class="cell"><div class="k">0# 元/升</div><div class="v" id="fc0">—</div></div>
    </div>
    <div class="row" id="fcSite" style="display:none;"></div>
    <div id="fcNotes"></div>
    <div id="windowBox" style="display:none; margin-top:12px;">
      <div class="row"><span id="wText"></span><span id="wRemain"></span></div>
      <div class="bar"><i id="wBar"></i></div>
    </div>
  </div>

  <select id="provinceSel"><option value="">全部省份</option></select>

  <div class="card" style="padding:0;">
    <table id="priceTable">
      <thead><tr><th>省份</th><th>92#</th><th>95#</th><th>98#</th><th>0#柴油</th></tr></thead>
      <tbody id="priceBody"></tbody>
    </table>
  </div>

  <footer>
    数据来源：汽油价格网 / 新浪财经 · 调价预测为按机制确定性推算，仅供参考<br/>
    <a href="/privacy">隐私政策</a> · 可「添加到主屏幕」离线查看
  </footer>
</div>

<!-- 定位相关：provinces.js 是 54KB 省级边界（压缩坐标），geo.js 负责解码 + 判定。
     换算全在本机做，经纬度不发往服务器。见 /privacy 第一节。 -->
<script src="/static/provinces.js"></script>
<script src="/static/geo.js"></script>
<script>
const fmt = (n) => (n == null ? "—" : n.toFixed(2));
const signed = (n) => (n == null ? "—" : (n >= 0 ? "+" : "") + n.toFixed(3));

let SNAP = null;         // 最近一次快照
let PRESET_NAME = null;  // 自动定位到的省名（浏览器定位 或 IP 推断）
let LOCATE_HOW = null;   // "browser" | "ip" | "failed"
let MANUAL = false;      // 用户手动选过省份 / 点过「查看全部」⇒ 不再自动覆盖

/* --- 定位 ---------------------------------------------------------------
 * 两条路，都只得到省级结果：
 *   1) 浏览器定位：需 HTTPS + 用户授权，最准。坐标在本机换算成省份，不发往服务器。
 *   2) IP 推断：无需授权，任何情况都能用，但会因 VPN / 运营商出口而不准。
 * 流程：IP 先出结果（快，不阻塞首屏），浏览器定位在后台升级并覆盖。
 */
const GEO_OPTS = { enableHighAccuracy: false, timeout: 8000, maximumAge: 10 * 60 * 1000 };

function canUseBrowserGeo() {
  // ⚠️ 浏览器定位是「强力功能」，只在安全上下文（HTTPS / localhost）可用。
  //    http 页面上 Chrome / Safari / Firefox 都会直接拒绝，问了也是白问，还白弹一次提示框。
  if (!window.isSecureContext) return false;
  if (!navigator.geolocation) return false;
  return !!(window.CNGeo && window.CN_PROVINCE_SHAPES);
}

function browserLocate() {
  return new Promise((resolve) => {
    navigator.geolocation.getCurrentPosition(
      (pos) => resolve(window.CNGeo.locate(pos.coords.latitude, pos.coords.longitude)),
      () => resolve(null),
      GEO_OPTS
    );
  });
}

async function locateByIp() {
  try {
    const r = await fetch("/api/locate");
    if (!r.ok) return;
    const d = await r.json();
    if (d.name) { PRESET_NAME = d.name; LOCATE_HOW = "ip"; }
  } catch (e) { /* 定位失败静默降级为手动选择 */ }
}

async function upgradeWithBrowserGeo() {
  if (canUseBrowserGeo()) {
    const name = await browserLocate();
    if (name) {
      // 精确定位成功：覆盖 IP 结果（哪怕两者相同，也要把来源标成「定位」）
      LOCATE_HOW = "browser";
      if (name !== PRESET_NAME) PRESET_NAME = name;
      refresh();
      return;
    }
  }
  if (!PRESET_NAME) { LOCATE_HOW = "failed"; renderLocateLine(); }
}

function findProvince(name) {
  if (!SNAP || !name) return null;
  return Object.values(SNAP.provinces || {}).find((p) => p.name === name) || null;
}

/** 状态行 + 表格一起重绘 —— 分头调很容易漏一个（曾经就漏出过空白的定位行）。 */
function refresh() {
  renderLocateLine();
  render();
}

function renderLocateLine() {
  const loc = document.getElementById("locate");
  const links = "<a href='#' data-act='retry'>重新定位</a><a href='#' data-act='all'>查看全部</a>";
  let html = "";
  if (PRESET_NAME) {
    const how = LOCATE_HOW === "browser" ? "定位" : "IP 粗略定位";
    const hit = findProvince(PRESET_NAME);
    const tail = SNAP && !hit ? "，该地区暂无油价数据" : "";
    html = "已按" + how + "选中 <b>" + PRESET_NAME + "</b> 的油价" + tail + links;
  } else if (LOCATE_HOW === "failed") {
    html = "未能自动定位，请手动选择省份" + links;
    if (!window.isSecureContext) {
      html += "<br/>（精确自动定位需要 HTTPS，当前页面是 HTTP，浏览器不允许申请定位权限）";
    }
  }
  loc.innerHTML = html;
  loc.querySelectorAll("a[data-act]").forEach((a) => {
    a.onclick = (e) => {
      e.preventDefault();
      if (a.dataset.act === "all") {
        MANUAL = true; PRESET_NAME = null; LOCATE_HOW = null;
        document.getElementById("provinceSel").value = "";
        refresh();
      } else {
        MANUAL = false; PRESET_NAME = null; LOCATE_HOW = null;
        document.getElementById("provinceSel").value = "";
        refresh();
        locateByIp().then(upgradeWithBrowserGeo);
      }
    };
  });
}

/* --- 渲染 ---------------------------------------------------------------- */

function render() {
  const el = (id) => document.getElementById(id);
  if (!SNAP) return;
  const snap = SNAP;

  el("updated").textContent = "更新时间：" + (snap.generated_at || "").replace("T", " ");

  const f = snap.forecast || {};
  const self = f.self;
  if (self) {
    el("forecastCard").style.display = "block";
    const cls = self.direction === "下调" ? "down" : "up";
    el("fcBig").className = "big " + cls;
    el("fcBig").textContent = (self.direction === "下调" ? "↓ " : "↑ ") +
      Math.abs(self.yuan_per_ton).toFixed(0) + " 元/吨";
    el("fcStatus").innerHTML = "<span class='pill " +
      (self.status === "搁浅" ? "warn" : "ok") + "'>" + self.status + "</span>";
    const c = f.consistent;
    el("fcConsist").innerHTML = "<span class='pill " +
      (c === true ? "ok" : c === false ? "warn" : "") + "'>" +
      (c === true ? "与网站一致" : c === false ? "与网站不一致" : "无法判定") + "</span>";
    const ypl = self.yuan_per_liter || {};
    el("fc92").textContent = signed(ypl["92"]);
    el("fc95").textContent = signed(ypl["95"]);
    el("fc98").textContent = signed(ypl["98"]);
    el("fc0").textContent = signed(ypl["0"]);

    // 网站预测的幅度：只给元/升时由后端折成元/吨（site_yuan_per_ton_source=derived），
    // 折算值要标明，别让用户以为网站原文写的就是元/吨。
    const site = f.site || {};
    const siteTon = f.site_yuan_per_ton;
    let siteTxt = "";
    if (site.direction && siteTon != null) {
      siteTxt = "网站预测 " + site.direction + " " + siteTon.toFixed(0) + " 元/吨" +
        (f.site_yuan_per_ton_source === "derived" ? "（由元/升折算）" : "");
    } else if (site.direction) {
      siteTxt = "网站预测 " + site.direction + "（未给幅度）";
    }
    el("fcSite").textContent = siteTxt;
    el("fcSite").style.display = siteTxt ? "" : "none";

    el("fcNotes").innerHTML = (f.notes || [])
      .map((n) => "<div class='note'>⚠ " + n + "</div>").join("");
  }

  const w = snap.window;
  if (w) {
    el("windowBox").style.display = "block";
    el("wText").textContent = "上次 " + w.anchor + " → 下次 " + w.next_date;
    el("wRemain").textContent = "剩 " + w.workdays_remaining + " 个工作日";
    el("wBar").style.width = Math.round((w.progress || 0) * 100) + "%";
  }

  const provinces = Object.values(snap.provinces || {});
  provinces.sort((a, b) => (a.region > b.region ? 1 : a.region < b.region ? -1 : 0));

  const sel = el("provinceSel");
  if (sel.options.length <= 1) {
    for (const p of provinces) {
      const o = document.createElement("option");
      o.value = p.slug; o.textContent = p.name;
      sel.appendChild(o);
    }
  }
  const hit = PRESET_NAME ? findProvince(PRESET_NAME) : null;
  if (!MANUAL) sel.value = hit ? hit.slug : "";
  const selVal = sel.value;

  let lastRegion = null;
  const body = el("priceBody");
  body.innerHTML = "";
  for (const p of provinces) {
    if (selVal && p.slug !== selVal) continue;
    if (p.region !== lastRegion) {
      const hr = document.createElement("tr");
      hr.innerHTML = "<td class='region-h' colspan='5'>" + p.region + "</td>";
      body.appendChild(hr);
      lastRegion = p.region;
    }
    const tr = document.createElement("tr");
    const pr = p.prices || {};
    if (selVal && p.slug === selVal) tr.className = "mine";
    tr.innerHTML = "<td>" + p.name + "</td><td>" + fmt(pr["92"]) +
      "</td><td>" + fmt(pr["95"]) + "</td><td>" + fmt(pr["98"]) +
      "</td><td>" + fmt(pr["0"]) + "</td>";
    body.appendChild(tr);
  }
  sel.onchange = () => { MANUAL = true; PRESET_NAME = null; refresh(); };
}

async function load() {
  try {
    const r = await fetch("/api/snapshot");
    if (!r.ok) throw new Error("HTTP " + r.status);
    SNAP = await r.json();
  } catch (e) {
    document.getElementById("updated").innerHTML =
      '<span class="err">加载失败：' + e.message + '</span>';
    return;
  }
  render();
}

/* --- 启动 ---------------------------------------------------------------- */

async function boot() {
  // IP 定位与快照并行取，两个都回来了再渲染一次 —— 避免「先渲染全部省份、
  // 定位结果到了再跳成某个省」的闪烁。浏览器定位较慢（最多 8s），不阻塞首屏。
  await Promise.all([load(), locateByIp()]);
  refresh();
  upgradeWithBrowserGeo();
}

// Service Worker：注册后可"添加到主屏幕"并离线看壳（需 HTTPS 或 localhost）
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("/static/sw.js").catch(() => {});
}

boot();
setInterval(load, 5 * 60 * 1000); // 每 5 分钟刷新页面缓存展示
</script>
</body>
</html>
